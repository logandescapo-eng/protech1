version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: protech_db
    environment:
      POSTGRES_DB: protech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - protech_network

  # Flask Application
  web:
    build: .
    container_name: protech_web
    command: python app.py
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=protech_db
      - DB_USER=postgres
      - DB_PASS=postgres123
      - FLASK_DEBUG=False
      - SECRET_KEY=change-this-to-a-random-secret-key-in-production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - protech_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  protech_network:
    driver: bridge
