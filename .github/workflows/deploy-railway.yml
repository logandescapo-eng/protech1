name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if Railway secrets are not configured yet
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway secrets
        id: check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ] || [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Railway deploy skipped. Add RAILWAY_TOKEN and RAILWAY_SERVICE_ID in GitHub repo Settings → Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.configured == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check.outputs.configured == 'true'
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "## Deployed to Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "Open your Railway public URL (Settings → Networking) to access the site." >> "$GITHUB_STEP_SUMMARY"
