name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify app imports
        run: python -c "from app import app; print('App OK')"

      - name: Verify health route
        run: |
          python -c "
          from app import app
          c = app.test_client()
          r = c.get('/health')
          assert r.status_code == 200, r.data
          print('Health OK:', r.get_json())
          "
