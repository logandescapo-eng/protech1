# Render Blueprint — connect GitHub repo at https://dashboard.render.com
# After deploy, your live URL will be like https://protech-web.onrender.com

services:
  - type: web
    name: protech-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protech-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"

databases:
  - name: protech-db
    databaseName: protech_db
    plan: free
