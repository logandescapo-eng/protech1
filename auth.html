<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="protech-pages-root" content="/protech1/">
    <title>ProTech — Sign in</title>
    <script src="live-config.js"></script>
    <script>
        (function () {
            var base = (window.PROTECH_LIVE_URL || '').trim().replace(/\/$/, '');
            if (!base) {
                return;
            }
            var tab = new URLSearchParams(window.location.search).get('tab');
            var dest = base + '/auth' + (tab ? '?tab=' + encodeURIComponent(tab) : '');
            window.location.replace(dest);
        })();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; text-align: center; color: #111827; }
        a { color: #2563eb; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>ProTech</h1>
    <p>Redirecting to sign in…</p>
    <p id="setup">If nothing happens, deploy the Flask app to Railway or Render and set <code>PROTECH_LIVE_URL</code> in <code>live-config.js</code>.</p>
    <p><a href="index.html">Back to home</a></p>
</body>
</html>
