<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Worker - ProTech</title>
</head>
<body>
    <h1>Book {{ worker.name }}</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Job Title" required><br>
        <textarea name="description" placeholder="Description" required></textarea><br>
        <input type="date" name="scheduled_date" required><br>
        <input type="time" name="scheduled_time" required><br>
        <input type="text" name="address" placeholder="Address" required><br>
        <input type="number" name="price" placeholder="Price" step="0.01" required><br>
        <button type="submit">Book</button>
    </form>
</body>
</html>
