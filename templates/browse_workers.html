<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Workers - ProTech</title>
</head>
<body>
    <h1>Browse Workers</h1>
    <a href="{{ url_for('user_dashboard') }}">Back to Dashboard</a>
    {% for worker in workers %}
        <div>
            <h3>{{ worker.name }}</h3>
            <p>Skills: {{ worker.skills }}</p>
            <p>Rating: {{ worker.rating }}/5.0</p>
            <a href="{{ url_for('book_worker', worker_id=worker.id) }}">Book</a>
        </div>
    {% endfor %}
</body>
</html>
