<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — ProTech</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; }
        button, .btn { background: #2563eb; color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <h1>Reset your password</h1>
    <p>Enter your account email. We will send a reset link (printed to server console in development).</p>
    <form method="post">
        {{ csrf_field() }}
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>
        <button type="submit">Send reset link</button>
    </form>
    <p style="margin-top:1.5rem;"><a href="{{ url_for('auth') }}">Back to login</a></p>
</body>
</html>
