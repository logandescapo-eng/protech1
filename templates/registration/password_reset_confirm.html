<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>New password — ProTech</title></head>
<body style="font-family:system-ui;max-width:28rem;margin:4rem auto;padding:0 1rem;">
    <h1>Set a new password</h1>
    {% if validlink %}
    <form method="post">
        {{ csrf_field() }}
        <p><label>New password<br><input type="password" name="new_password1" required></label></p>
        <p><label>Confirm password<br><input type="password" name="new_password2" required></label></p>
        <button type="submit">Update password</button>
    </form>
    {% else %}
    <p>This reset link is invalid or expired.</p>
    {% endif %}
</body>
</html>
