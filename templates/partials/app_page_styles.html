<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; color: #111827; line-height: 1.5; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .nav a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .sub { color: #6b7280; margin-bottom: 1.5rem; }
    .flash { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .flash.success { background: #d1fae5; color: #065f46; }
    .flash.error { background: #fee2e2; color: #991b1b; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card h3 { margin-bottom: 0.35rem; }
    .meta { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.75rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .filters input, .filters select { padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 8px; width: 100%; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group input, .form-group textarea, .form-group select {
        width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 8px;
    }
    .form-group textarea { min-height: 100px; }
    .rating { color: #f59e0b; font-weight: 600; }
    .empty { text-align: center; padding: 2rem; color: #6b7280; }
    .list-item { padding: 1rem 0; border-bottom: 1px solid #e5e7eb; }
    .list-item:last-child { border-bottom: none; }
    .list-item.unread { background: #eff6ff; margin: 0 -1.25rem; padding-left: 1.25rem; padding-right: 1.25rem; }
    .list-item h3 { font-size: 1rem; margin-bottom: 0.25rem; }
    .badge { display: inline-block; background: #ef4444; color: #fff; font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 999px; margin-left: 0.25rem; }
    .grid-2 { display: grid; grid-template-columns: 240px 1fr; gap: 1rem; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
    .contact { display: block; padding: 0.6rem 0.75rem; border-radius: 8px; text-decoration: none; color: inherit; margin-bottom: 0.25rem; }
    .contact:hover { background: #f3f4f6; }
    .contact.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
    .msg { margin-bottom: 0.75rem; max-width: 85%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.9rem; }
    .msg.mine { background: #2563eb; color: #fff; margin-left: auto; }
    .msg.theirs { background: #f3f4f6; }
    .msg-meta { font-size: 0.75rem; opacity: 0.75; margin-top: 0.25rem; }
    .btn-danger { background: #ef4444; color: #fff; }
    .actions-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
</style>
