    <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">

                    <path d="M323.5,140.1c-7.2-8.2-18.4-13-30.1-13h-1.5c-1.2,0.1-3.3,0.3-6.2,0.5c-4.5,0.3-10.6,0.8-17.9,1.3c-14.5,1-33.1,2.2-52.6,2.9c-38.9,1.4-83.1,0.2-113-10.1c-5.1-1.8-10.6-2.7-16.1-2.7c-11.9,0-23.3,4.8-31.6,13.4c-8.9,9.2-13.4,21.6-12.5,34.4l5.7,79.5c0.9,12.2,6.7,23.5,16.2,31.1l99.4,79.5c8.5,6.8,19,10.5,29.8,10.5c5.5,0,11-0.9,16.3-2.8l121.1-48.4c10.7-4.3,19.2-12.5,23.6-23.1c4.4-10.5,4.7-22.2,0.7-32.9L323.5,140.1z"/>

            </div>
            ProTech
        </div>

    <div class="top-nav-right">
        {% if layout_user_type == 'user' %}
        <form class="search-bar" action="{{ url_for('browse_workers') }}" method="GET" style="display:flex;align-items:center;">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" name="skill" placeholder="Search for services or professionals...">
        </form>
        {% endif %}
        <div class="nav-panel-wrap">
            <button type="button" class="icon-btn" id="btn-notifications" aria-expanded="false" aria-haspopup="true" title="Notifications">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                {% if layout_unread_notifications %}<span class="notification-badge count">{{ layout_unread_notifications }}</span>{% endif %}
            </button>

        </div>
        <div class="nav-panel-wrap">
            <button type="button" class="icon-btn" id="btn-messages" aria-expanded="false" aria-haspopup="true" title="Messages">

                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                {% if layout_unread_messages %}<span class="notification-badge count">{{ layout_unread_messages }}</span>{% endif %}

            <div class="user-avatar">{{ layout_initials }}</div>
            <div class="user-info">

                <div class="user-role">{% if layout_user_type == 'worker' %}Professional{% else %}Client{% endif %}</div>
            </div>
